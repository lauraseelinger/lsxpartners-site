    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));

// Key-in-link: #k=<password> opens without typing. The fragment is never sent to a server,
// so crawlers and link previews only ever receive the ciphertext.
(function(){var m=location.hash.match(/[#&]k=([^&]+)/);if(m){document.getElementById('pw').value=decodeURIComponent(m[1]);open_();}})();
